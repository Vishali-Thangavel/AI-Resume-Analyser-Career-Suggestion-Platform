<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – ResumAI</title>
<link rel="stylesheet" href="/static/css/main.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 1rem; }
.auth-card { width:100%; max-width:440px; padding:2.5rem; }
.auth-logo { text-align:center; margin-bottom:2rem; }
.auth-logo a { font-family:var(--font-head); font-size:1.8rem; font-weight:800; color:var(--teal); text-decoration:none; }
.auth-logo a span { color:var(--amber); }
h2 { font-size:1.5rem; margin-bottom:.4rem; text-align:center; }
.auth-sub { color:var(--muted); font-size:.875rem; text-align:center; margin-bottom:2rem; }
.form-group { margin-bottom:1.2rem; }
.auth-footer { text-align:center; margin-top:1.5rem; font-size:.85rem; color:var(--muted); }
.auth-footer a { color:var(--teal); text-decoration:none; }
.free-badge { background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.2); border-radius:8px; padding:.8rem 1rem; margin-bottom:1.5rem; font-size:.8rem; color:var(--green); }
</style>
</head>
<body>
<div class="card auth-card">
  <div class="auth-logo"><a href="/">Resum<span>AI</span></a></div>
  <h2>Create your account</h2>
  <p class="auth-sub">Free forever · No credit card required</p>

  <div class="free-badge">✓ Free plan includes: 5 analyses/month, skill extraction, ATS check</div>

  <div class="form-group">
    <label class="form-label">Username</label>
    <input type="text" class="form-input" id="username" placeholder="johndoe">
  </div>
  <div class="form-group">
    <label class="form-label">Email</label>
    <input type="email" class="form-input" id="email" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input type="password" class="form-input" id="password" placeholder="Min 6 characters">
  </div>

  <button class="btn btn-primary" style="width:100%;padding:.8rem;font-size:1rem;" onclick="doRegister()">Create Free Account</button>

  <div class="auth-footer">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

<div id="toast"></div>
<script src="/static/js/main.js"></script>
<script>
async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !email || !password) { showToast('Please fill all fields', 'error'); return; }
  if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
  try {
    const res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({username,email,password}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showToast('Account created! Welcome, ' + data.username + '!', 'success');
    setTimeout(() => window.location.href='/', 1000);
  } catch(e) { showToast(e.message, 'error'); }
}
</script>
</body>
</html>
